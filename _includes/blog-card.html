<article class="project-card blog-card">
  <p>{{ include.post.date | date: "%B %d, %Y" }}</p>

  <h3>
    <a href="{{ include.post.url | relative_url }}">
      {{ include.post.title }}
    </a>
  </h3>

  <p>
    {{ include.post.excerpt | strip_html | truncatewords: 30 }}
  </p>

  <a href="{{ include.post.url | relative_url }}">
    Read Post →
  </a>
</article>
